<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Hind Surfer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hind Surfer: an original endless runner on Indian railway tracks. Play in your browser or on your phone.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚂</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b1233;--fg:#fff5e0;--sf:#ff9933;--gr:#138808}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1233;--fg:#fff5e0}}
:root[data-theme="dark"]{--bg:#1b1233;--fg:#fff5e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:'Baloo 2',system-ui,'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;font-weight:800;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,10,40,.35)}
#ov[hidden]{display:none}
.card{background:rgba(27,18,51,.88);border-radius:22px;padding:24px 28px;text-align:center;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{margin:0;font-size:clamp(40px,11vw,60px);line-height:1;font-weight:800;color:var(--sf)}
.flag{display:flex;flex-direction:column;width:150px;margin:10px auto 14px;border-radius:3px;overflow:hidden}
.flag i{height:7px}.flag i:nth-child(1){background:#ff9933}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#138808}
.card p{margin:6px 0;font-size:18px;line-height:1.3}
.hint{font-size:15px;opacity:.75}
button{margin-top:12px;background:var(--sf);color:#1b1233;font:800 20px 'Baloo 2',system-ui,sans-serif;border:0;border-radius:999px;padding:10px 28px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span id="sc">0</span><span id="cn">₹ 0</span></div>
<div id="ov"><div class="card">
<h1 id="ti">Hind Surfer</h1><div class="flag"><i></i><i></i><i></i></div>
<p id="msg">Patri par daudo, trains se bacho, ₹ batoro.</p>
<p id="best"></p>
<button id="go">Daudna shuru karo</button>
<p class="hint">Keys: ← → lane, ↑ kood, ↓ phisalo. Phone par swipe karo.</p>
</div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,hz,base,LW,F=14;
function rs(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;g.setTransform(r,0,0,r,0,0);hz=H*.36;base=H*.86;LW=Math.min(W*.3,H*.26)}
addEventListener('resize',rs);rs();
const S=z=>F/(F+z),Y=z=>hz+(base-hz)*S(z),X=(l,z)=>W/2+l*LW*S(z);
function poly(...a){g.beginPath();g.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)g.lineTo(a[i],a[i+1]);g.closePath();g.fill()}
function ci(x,y,r){g.beginPath();g.arc(x,y,Math.max(r,0),0,7);g.fill()}
let st='ready',dist=0,coins=0,speed=17,lane=0,px=0,jy=0,vy=0,sl=0,objs=[],sp=6,shake=0,best=0,t=0,run=0;
try{best=+localStorage.getItem('hindsurfer')||0}catch(e){}
const score=()=>Math.floor(dist/2)+coins*10;
function reset(){dist=0;coins=0;speed=17;lane=0;px=0;jy=0;vy=0;sl=0;objs=[];sp=6;shake=0}
function line(l,z,n){for(let i=0;i<n;i++)objs.push({t:'coin',l,z:z+i*2.4,len:0})}
function spawn(){
  const L=[-1,0,1].sort(()=>Math.random()-.5),r=Math.random(),z=72;let ml=1;
  if(r<.34){const n=Math.random()<.4?2:1;for(let i=0;i<n;i++){const len=7+Math.random()*8;ml=Math.max(ml,len);objs.push({t:'train',l:L[i],z,len,c:Math.random()<.5?0:1})}
    if(n==1&&Math.random()<.7)line(L[1],z,6)}
  else if(r<.58){const n=Math.random()<.5?2:1;for(let i=0;i<n;i++)objs.push({t:'low',l:L[i],z,len:.8});line(L[2],z,5)}
  else if(r<.74){[-1,0,1].forEach(l=>objs.push({t:'high',l,z,len:.8}))}
  else line(L[0],z,7);
  sp=speed*1.05+8+Math.random()*8+ml;
}
function crash(){st='over';if(!RM)shake=.4;const s=score();if(s>best){best=s;try{localStorage.setItem('hindsurfer',best)}catch(e){}}
  $('ti').textContent='Takra gaye!';$('msg').textContent='Score '+s+' · ₹ '+coins;$('best').textContent='Best: '+best;$('go').textContent='Phir se daudo';$('ov').hidden=false;$('go').focus()}
function start(){reset();st='play';$('ov').hidden=true}
function upd(dt){
  if(st==='ready'){dist+=10*dt;return}
  if(st!=='play')return;
  speed=Math.min(34,17+dist*.004);dist+=speed*dt;
  px+=(lane-px)*Math.min(1,dt*14);
  if(jy>0||vy>0){vy-=9*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0}}
  if(sl>0)sl-=dt;
  sp-=speed*dt;if(sp<=0)spawn();
  for(const o of objs){o.z-=speed*dt;
    if(Math.abs(px-o.l)<.55&&o.z<.6&&o.z+o.len>-.6){
      if(o.t==='coin'){if(!o.d){o.d=1;coins++}}
      else if(o.t==='train'||(o.t==='low'&&jy<.5)||(o.t==='high'&&sl<=0))crash()}}
  objs=objs.filter(o=>!o.d&&o.z+o.len>-4);
}
const pal=['#e8a33d','#d9527a','#2fa4a1','#e67e5a','#8a63d2','#f2c14e'];
const hs=i=>{let h=Math.imul(i,2654435761)>>>0;h^=h>>>13;return h>>>0};
function scene(){
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#3b1f6b');gr.addColorStop(.6,'#e2575e');gr.addColorStop(1,'#ffb347');
  g.fillStyle=gr;g.fillRect(-30,-30,W+60,hz+30);
  g.fillStyle='#ffe29a';g.beginPath();g.arc(W/2,hz,LW*.9,Math.PI,0);g.fill();
  for(let i=0;i<3;i++){const kx=W*(.2+.3*i)+Math.sin(t*.6+i*2)*20,ky=hz*(.22+.2*((i*2)%3))+Math.sin(t*.9+i)*8;
    g.fillStyle=['#138808','#ffffff','#ff9933'][i];poly(kx,ky-14,kx+10,ky,kx,ky+14,kx-10,ky);
    g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.moveTo(kx,ky+14);g.quadraticCurveTo(kx+8,ky+26,kx-4,ky+38);g.stroke()}
  g.fillStyle='#2b1d3f';g.fillRect(-30,hz,W+60,H-hz+30);
  for(let k=24;k>=0;k--){const zz=k*7-(dist%7);if(zz<-5)continue;const idx=Math.floor(dist/7)+k;
    for(const sd of[-1,1]){const h=hs(idx*2+(sd>0?1:0)),s=S(zz),bw=(1.3+(h>>3&3)*.3)*LW*s,bh=(1.6+(h>>5&7)*.35)*LW*s,x=X(sd*2.7,zz),y=Y(zz);
      g.fillStyle=pal[(h>>8)%pal.length];g.fillRect(x-bw/2,y-bh,bw,bh);
      if(h&1){g.beginPath();g.arc(x,y-bh,bw/2,Math.PI,0);g.fill()}
      g.fillStyle='rgba(20,10,40,.55)';g.fillRect(x-bw*.3,y-bh*.7,bw*.18,bh*.22);g.fillRect(x+bw*.12,y-bh*.7,bw*.18,bh*.22);g.fillRect(x-bw*.3,y-bh*.35,bw*.18,bh*.22);g.fillRect(x+bw*.12,y-bh*.35,bw*.18,bh*.22)}}
  const bg=g.createLinearGradient(0,hz,0,H);bg.addColorStop(0,'#7a6a78');bg.addColorStop(.5,'#4b4550');bg.addColorStop(1,'#2a262f');
  g.fillStyle=bg;poly(X(-2.1,300),Y(300),X(2.1,300),Y(300),X(2.1,-6),Y(-6),X(-2.1,-6),Y(-6));
  for(let k=0;k<46;k++){const zz=k*2.5-(dist%2.5);if(zz<-5)continue;const s=S(zz),sx=X(-1.6,zz),sy=Y(zz)-.1*LW*s,sw=3.2*LW*s;
    g.fillStyle='#8b8289';g.fillRect(sx,sy,sw,.1*LW*s);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(sx,sy,sw,.025*LW*s)}
  g.fillStyle='rgba(190,180,185,.5)';
  for(let i=0;i<80;i++){const zz=((i*8.7-dist)%70+70)%70,s=S(zz);g.fillRect(X((hs(i)%420)/100-2.1,zz),Y(zz),.05*LW*s,.03*LW*s)}
  g.lineWidth=2;g.strokeStyle='rgba(255,240,200,.25)';
  for(const l of[-.5,.5]){g.beginPath();g.moveTo(X(l,300),Y(300));g.lineTo(X(l,-6),Y(-6));g.stroke()}
  g.lineWidth=3;g.strokeStyle='rgba(220,225,240,.85)';
  for(const c of[-1,0,1])for(const o of[-.22,.22]){g.beginPath();g.moveTo(X(c+o,300),Y(300));g.lineTo(X(c+o,-6),Y(-6));g.stroke()}
  for(let k=12;k>=0;k--){const zz=k*12-(dist%12);if(zz<-5)continue;const s=S(zz),y=Y(zz),top=y-2.6*LW*s;
    g.fillStyle='#2b2733';for(const sd of[-1,1])g.fillRect(X(sd*1.95,zz)-.04*LW*s,top,.08*LW*s,y-top);
    g.strokeStyle='#2b2733';g.lineWidth=Math.max(1,.05*LW*s);g.beginPath();g.moveTo(X(-1.95,zz),top+.15*LW*s);g.lineTo(X(1.95,zz),top+.15*LW*s);g.stroke();
    g.fillStyle='#ffd27a';for(const c of[-1,0,1])ci(X(c,zz),top+.2*LW*s,.05*LW*s)}
  const hg=g.createLinearGradient(0,hz-H*.08,0,hz+H*.12);hg.addColorStop(0,'rgba(255,190,110,0)');hg.addColorStop(.5,'rgba(255,190,110,.45)');hg.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle=hg;g.fillRect(-30,hz-H*.08,W+60,H*.2);
}
function train(o){
  const z=Math.max(o.z,.25),s=S(z),x=X(o.l,z),y=Y(z),w=LW*.86*s,h=LW*1.55*s,z2=z+o.len,s2=S(z2),y2=Y(z2),h2=LW*1.55*s2;
  const body=o.c?'#a3342f':'#1f5fa8';
  if(o.l!==0){const e=o.l<0?1:-1,xe=x+e*w/2,xf=X(o.l+e*.43,z2);g.fillStyle=o.c?'#7d2622':'#174a84';poly(xe,y,xe,y-h,xf,y2-h2,xf,y2)}
  g.fillStyle=o.c?'#c9c2d6':'#b9d0e8';poly(x-w/2,y-h,x+w/2,y-h,X(o.l+.43,z2),y2-h2,X(o.l-.43,z2),y2-h2);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y,w*.62,w*.07,0,0,7);g.fill();
  const bgr=g.createLinearGradient(0,y-h,0,y);bgr.addColorStop(0,'rgba(255,255,255,.18)');bgr.addColorStop(1,'rgba(0,0,0,.4)');
  g.fillStyle=body;g.fillRect(x-w/2,y-h,w,h);g.fillStyle=bgr;g.fillRect(x-w/2,y-h,w,h);
  g.fillStyle='#ff9933';g.fillRect(x-w/2,y-h*.34,w,h*.09);
  g.fillStyle='#e9e9ef';g.fillRect(x-w*.14,y-h*.97,w*.28,h*.05);
  g.fillStyle='#10162a';g.fillRect(x-w*.38,y-h*.9,w*.76,h*.34);
  g.fillStyle='rgba(255,255,255,.14)';poly(x-w*.38,y-h*.9,x-w*.08,y-h*.9,x-w*.24,y-h*.56,x-w*.38,y-h*.56);
  g.fillStyle='#222';g.fillRect(x-w/2,y-h*.07,w,h*.07);
  g.fillStyle='rgba(255,230,140,.22)';ci(x-w*.28,y-h*.16,w*.2);ci(x+w*.28,y-h*.16,w*.2);
  g.fillStyle='#ffe58a';ci(x-w*.28,y-h*.16,w*.07);ci(x+w*.28,y-h*.16,w*.07);
}
function stripes(x,y,w,h,a,b){const n=6;for(let i=0;i<n;i++){g.fillStyle=i%2?a:b;g.fillRect(x+i*w/n,y,w/n,h)}}
function obj(o){
  g.globalAlpha=o.z>58?Math.max(0,(72-o.z)/14):1;
  const s=S(o.z),x=X(o.l,o.z),y=Y(o.z);
  if(o.t==='train')train(o);
  else if(o.t==='low'){const w=LW*.86*s,h=LW*.5*s;g.fillStyle='#444';g.fillRect(x-w*.44,y-h,w*.08,h);g.fillRect(x+w*.36,y-h,w*.08,h);stripes(x-w/2,y-h,w,h*.5,'#d8362f','#fff')}
  else if(o.t==='high'){const w=LW*.86*s;g.fillStyle='#555';g.fillRect(x-w*.5,y-LW*1.25*s,w*.07,LW*1.25*s);g.fillRect(x+w*.43,y-LW*1.25*s,w*.07,LW*1.25*s);stripes(x-w/2,y-LW*1.15*s,w,LW*.35*s,'#111','#ffc83d')}
  else{const r=.17*LW*s,cy=y-.55*LW*s;g.fillStyle='#ffc83d';g.beginPath();g.ellipse(x,cy,r*(.55+.45*Math.abs(Math.cos(t*5+o.z))),r,0,0,7);g.fill();
    g.fillStyle='#8a5a00';g.font='800 '+(r*1.2)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('₹',x,cy+r*.05)}
  g.globalAlpha=1;
}
function leg(cx,d,u){g.beginPath();g.moveTo(cx*u,-.5*u);g.lineTo((cx+d)*u,-.06*u);g.stroke();g.fillStyle='#2a1a10';ci((cx+d)*u,-.05*u,.075*u)}
function player(){
  const u=LW,x=W/2+px*u,y=base-jy*u,sw=jy>0?.25:Math.sin(run*5.5)*.3;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,base,.3*u*(1-jy*.35),.07*u,0,0,7);g.fill();
  g.save();g.translate(x,y);if(sl>0){g.rotate(-1.2);g.translate(.1*u,0)}
  g.lineCap='round';g.lineWidth=.13*u;g.strokeStyle='#f3efe4';leg(-.09,sw,u);leg(.09,-sw,u);
  g.strokeStyle='#e58a2b';g.lineWidth=.1*u;
  for(const sd of[-1,1]){g.beginPath();g.moveTo(sd*.21*u,-.95*u);g.lineTo(sd*.23*u+sd*sw*.35*u,-.62*u);g.stroke()}
  g.fillStyle='#ff9933';g.beginPath();g.roundRect(-.2*u,-1.02*u,.4*u,.56*u,.1*u);g.fill();
  g.fillStyle='#c98d5a';ci(0,-1.18*u,.15*u);
  g.fillStyle='#138808';g.beginPath();g.ellipse(0,-1.28*u,.18*u,.1*u,0,0,7);g.fill();
  g.fillStyle='#fff';g.fillRect(-.18*u,-1.3*u,.36*u,.03*u);
  g.restore();
}
function draw(){
  g.save();if(shake>0)g.translate((Math.random()-.5)*30*shake,(Math.random()-.5)*30*shake);
  scene();objs.sort((a,b)=>b.z-a.z);for(const o of objs)obj(o);player();g.restore();
}
let last=0,ls='',lc='';
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;if(shake>0)shake-=dt;run+=dt*(st==='over'?0:speed*.35);upd(dt);draw();
  const s=String(score()),c='₹ '+coins;if(s!==ls){$('sc').textContent=s;ls=s}if(c!==lc){$('cn').textContent=c;lc=c}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const mv=d=>{if(st==='play')lane=Math.max(-1,Math.min(1,lane+d))};
const jump=()=>{if(st==='play'&&jy===0&&vy===0){vy=3.8;jy=.0001;sl=0}};
const slide=()=>{if(st==='play'){sl=.7;if(jy>0)vy=-7}};
addEventListener('keydown',e=>{const k=e.key;
  if(st!=='play'){if(k==='Enter'||k===' '){e.preventDefault();start()}return}
  if(k==='ArrowLeft'||k==='a')mv(-1);else if(k==='ArrowRight'||k==='d')mv(1);
  else if(k==='ArrowUp'||k==='w'||k===' '){e.preventDefault();jump()}else if(k==='ArrowDown'||k==='s'){e.preventDefault();slide()}});
let sx=0,sy=0,act=false;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;act=true});
addEventListener('pointermove',e=>{if(!act)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;act=false;
  if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<0)jump();else slide()});
addEventListener('pointerup',()=>act=false);
$('go').addEventListener('click',start);
</script>
</body>
</html>
